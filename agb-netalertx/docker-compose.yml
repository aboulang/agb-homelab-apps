services:
  server:
    image: ghcr.io/netalertx/netalertx:latest
    network_mode: host
    restart: on-failure
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    environment:
      PUID: "20211"
      PGID: "20211"
      LISTEN_ADDR: "0.0.0.0"
      PORT: "20211"
      GRAPHQL_PORT: "20212"
      ALWAYS_FRESH_INSTALL: "false"
      NETALERTX_DEBUG: "0"
    volumes:
      - ${APP_DATA_DIR}/data:/data:rw
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /tmp:mode=1700,uid=0,gid=0,rw,noexec,nosuid,nodev
    mem_limit: 2048m
    mem_reservation: 1024m
    cpu_shares: 512
    pids_limit: 512
