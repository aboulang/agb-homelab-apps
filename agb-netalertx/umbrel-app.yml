manifestVersion: 1
id: agb-netalertx
category: networking
name: NetAlertX
version: "v26.9.0"
tagline: Discover and monitor devices on your local network
description: >-
  NetAlertX continuously discovers devices on your local network and records
  their presence, identity, and changes. It combines multiple discovery methods,
  including ARP, Nmap, mDNS, NetBIOS, and optional SNMP, so devices do not need
  to support SNMP to be inventoried. Use it as the discovery side of a future
  NetAlertX-to-HomeBox synchronization workflow.
developer: NetAlertX
website: https://netalertx.com
