port: 20211
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
icon: https://raw.githubusercontent.com/netalertx/NetAlertX/main/front/img/NetAlertX_logo.png
releaseNotes: >-
  Initial AGB Homelab Apps package. Uses host networking and the capabilities
  required for local-network discovery, with persistent data managed by Umbrel.
